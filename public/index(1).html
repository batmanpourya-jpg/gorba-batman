<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1687f8">
<meta name="description" content="گوربا بتمن؛ پیام‌رسان ساده">
<link rel="icon" href="/favicon.jpg" type="image/jpeg">
<title>گوربا بتمن</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
<header><div class="brand"><img src="/favicon.jpg" alt=""><b>گوربا بتمن</b></div><span id="status">آماده</span></header>

<section id="login" class="card">
<h2>ورود</h2><p>یک نام نمایشی برای ورود انتخاب کن.</p>
<input id="name" maxlength="40" autocomplete="nickname" placeholder="نام نمایشی">
<button id="join">ورود به گوربا بتمن</button>
<div class="note">ورود با Google در مرحله OAuth جداگانه فعال می‌شود.</div>
</section>

<section id="main" class="hidden">
<div class="profile-card">
<button id="avatarButton" class="avatar-button" type="button"><span id="avatarText">👤</span><img id="avatar" alt="" hidden></button>
<div><strong id="myName">کاربر</strong><small>برای انتخاب عکس پروفایل روی تصویر بزن</small></div>
<input id="avatarFile" type="file" accept="image/*" hidden>
</div>

<div class="search"><input id="search" maxlength="40" placeholder="جستجوی اسم کاربر..."><div id="results"></div></div>
<div id="conversations" class="conversations"></div>

<div id="chatTitle" class="chat-title" hidden>
<button id="back" type="button">←</button>
<div><strong id="peerName">یک نفر را انتخاب کن</strong><small id="chatHint">برای شروع، یک کاربر را انتخاب کن.</small></div>
</div>

<section id="chat" hidden>
<div id="messages"></div>
<form id="form">
<label class="attach"><input id="mediaFile" type="file" accept="image/*,video/*" hidden>📎</label>
<input id="text" maxlength="2000" autocomplete="off" placeholder="پیامت را بنویس..." disabled>
<button id="send" type="submit" disabled>ارسال</button>
</form>
</section>
</section>
</div>
<script src="/app.js"></script>
</body></html>
