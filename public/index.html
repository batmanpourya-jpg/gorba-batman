<section id="auth" class="auth"><div class="card"><img class="logo" src="/favicon.jpg"><h1>گوربا بتمن</h1><p class="muted" style="text-align:center">پیام‌رسان خصوصی دوستان</p><input id="name" class="input" maxlength="40" placeholder="نام نمایشی خودت را وارد کن"><button id="login" class="primary">ورود / ساخت حساب</button><div id="err" class="err"></div></div></section>
<section id="app" class="app hidden"><aside id="side" class="side"><div class="brand"><button id="mobileClose" class="mobile-back">‹</button><img src="/favicon.jpg"><div class="grow"><b>گوربا بتمن</b><div class="muted">رفیق‌ها و گفتگوها</div></div></div><div class="search"><input id="search" placeholder="🔎 پیدا کردن افراد با نام..."></div><div class="section-title">نتایج جستجو</div><div id="results" class="results"></div><div class="section-title">👥 رفیق‌ها و گفتگوها</div><div id="chats" class="chats"></div><div class="profile"><div id="myAvatar" class="avatar"></div><div class="grow"><b id="myName"></b><small class="muted">حساب من</small></div><button id="profileBtn" class="ghost">پروفایل</button><button id="logout" class="ghost">خروج</button></div></aside><main class="main"><div id="empty" class="empty"><button id="mobileOpen" class="mobile-menu">☰ گفتگوها</button><h2>گفتگو را شروع کن 👋</h2><div>هر کسی که وارد گوربا بتمن شود اینجا خودکار می‌آید؛ برای پیدا کردن سریع‌تر هم می‌توانی جستجو کنی.</div></div><div id="chat" class="hidden" style="display:flex;flex-direction:column;height:100%"><header class="top"><button id="mobileOpen2" class="mobile-menu">☰</button><div id="chatAvatar" class="avatar"></div><div class="grow"><b id="chatName"></b><div id="chatStatus" class="muted"></div></div></header><div id="messages" class="messages"></div><div class="composer"><textarea id="text" placeholder="پیامت را بنویس... (Enter برای ارسال)" maxlength="4000"></textarea><button id="send" class="send">➤</button></div></div></main></section>
<div id="profileBox" class="profile-box hidden"><div class="modal"><h3>پروفایل من</h3><input id="profileName" class="input" maxlength="40" placeholder="نام"><textarea id="profileBio" class="input" maxlength="160" placeholder="بیوگرافی کوتاه"></textarea><label class="muted">عکس پروفایل</label><input id="avatarFile" class="file" type="file" accept="image/*"><div class="row"><button id="saveProfile" class="primary">ذخیره</button><button id="closeProfile" class="ghost">بستن</button></div><div id="profileErr" class="err"></div></div></div>
