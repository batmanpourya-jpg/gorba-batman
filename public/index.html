<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گوربا بتمن</title><link rel="icon" href="/favicon.jpg"><style>
:root{--bg:#081321;--panel:#0b1828;--panel2:#0d1b2d;--input:#091524;--line:#1c3148;--text:#eaf2ff;--muted:#91a5bc;--accent:#1677ff;--bubble:#13263a;--mine:#146ee8;--chatbg:#081321;--custom-bg:none}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}body:before{content:"";position:fixed;inset:0;z-index:-1;background:var(--chatbg);background-image:var(--custom-bg);background-size:cover;background-position:center;opacity:.32;pointer-events:none}body[data-theme=light]{--bg:#eef4fb;--panel:#fff;--panel2:#fff;--input:#f2f6fa;--line:#d8e2ed;--text:#172638;--muted:#60758a;--bubble:#e7eef6;--mine:#2478e5;--chatbg:#edf4fb}body[data-theme=dark]{--bg:#111;--panel:#181818;--panel2:#202020;--input:#111;--line:#303030;--text:#eee;--muted:#999;--bubble:#282828;--mine:#315f9e;--chatbg:#111}body[data-theme=purple]{--bg:#130e1d;--panel:#1b1428;--panel2:#21182f;--input:#140e1e;--line:#3b2b52;--text:#f5ecff;--muted:#ae9cbe;--bubble:#2a1e3a;--mine:#7448c5;--chatbg:#150e21}body[data-bg=blue]{--chatbg:linear-gradient(135deg,#071a35,#0c315b)}body[data-bg=gradient]{--chatbg:linear-gradient(135deg,#101b3d,#1e0f30,#092c31)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#173a68,#07111f 55%)}.card{width:min(420px,100%);background:var(--panel2);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 25px 80px #0008}.logo{width:78px;height:78px;border-radius:22px;display:block;margin:0 auto 16px;object-fit:cover}.card h1{text-align:center;margin:8px 0}.muted{color:var(--muted);font-size:13px}.input{width:100%;padding:14px;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:14px;outline:0;margin:14px 0}.primary{width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700}.err{min-height:22px;color:#ff8291;font-size:13px;margin-top:8px}.app{height:100vh;display:grid;grid-template-columns:360px 1fr;background:var(--bg)}.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}.brand{padding:15px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.brand img{width:44px;height:44px;border-radius:14px;object-fit:cover}.brand b{font-size:18px}.search{padding:12px 14px}.search input{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:13px;outline:0}.section-title{padding:6px 16px;color:var(--muted);font-size:12px}.results,.chats{overflow:auto;padding:0 10px}.person,.chatitem{padding:11px;border-radius:14px;display:flex;gap:10px;align-items:center;cursor:pointer}.person:hover,.chatitem:hover,.selected{background:#ffffff0c}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#176fe8;color:#fff;font-weight:bold;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.big{width:90px;height:90px;margin:auto;font-size:30px}.clickable{cursor:pointer}.grow{flex:1;min-width:0}.person small,.chatitem small{display:block;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:9px;height:9px;border-radius:50%;background:#4e6378;display:inline-block;margin-left:5px}.dot.on{background:#25d67a}.unread{min-width:22px;height:22px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:bold}.profile{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}.ghost{background:#ffffff12;color:var(--text);padding:10px 12px;border-radius:12px}.main{display:flex;flex-direction:column;min-width:0}.empty{margin:auto;text-align:center;color:var(--muted);padding:20px}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:12px 18px;gap:12px;background:#00000012}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:8px}.bubble-wrap{display:flex;flex-direction:column;max-width:min(70%,560px)}.mine-wrap{align-self:flex-start}.theirs-wrap{align-self:flex-end}.bubble{padding:10px 13px;border-radius:17px;background:var(--bubble);line-height:1.7;word-break:break-word;position:relative}.mine{background:var(--mine);color:#fff}.time{font-size:10px;color:var(--muted);margin:3px 8px}.deleted{opacity:.6;font-style:italic}.composer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel)}.composer textarea{resize:none;flex:1;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:15px;padding:11px;min-height:46px;max-height:130px;outline:0}.send,.attach{width:52px;border-radius:15px;background:var(--accent);color:#fff;font-weight:bold}.attach{background:#ffffff12;color:var(--text)}.media-img,.media-video{display:block;max-width:min(440px,70vw);max-height:380px;border-radius:13px}.media-name{font-size:11px;margin-top:5px;opacity:.8}.profile-box{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20;padding:20px}.modal{width:min(460px,100%);background:var(--panel2);border:1px solid var(--line);border-radius:22px;padding:20px}.modal h3{margin-top:0}.file{width:100%;padding:10px;background:var(--input);border:1px solid var(--line);border-radius:12px;color:var(--text)}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.wide{width:100%;margin-top:14px}.bio{white-space:pre-wrap;line-height:1.8}.setting-title{font-size:13px;color:var(--muted);margin:14px 0 8px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{padding:12px;border-radius:12px;background:var(--input);border:1px solid var(--line);color:var(--text)}.choice.active{border-color:var(--accent);box-shadow:0 0 0 2px #1677ff33}.gallery-choice{text-align:center;cursor:pointer}.empty-list{text-align:center;color:var(--muted);padding:20px;font-size:13px}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.side.open{display:flex;position:absolute;inset:0 0 0 auto;width:min(94vw,380px);z-index:5}.top{height:62px}.bubble-wrap{max-width:84%}.mobile-menu{display:block!important}.mobile-back{display:block!important}}.mobile-menu,.mobile-back{display:none;background:#ffffff12;color:var(--text);border-radius:11px;padding:9px 11px}
</style></head><body>
<section id="auth" class="auth"><div class="card"><img class="logo" src="/favicon.jpg"><h1>گوربا بتمن</h1><p class="muted" style="text-align:center">پیام‌رسان خصوصی دوستان</p><input id="name" class="input" maxlength="40" placeholder="نام نمایشی خودت را وارد کن"><button id="login" class="primary">ورود / ساخت حساب</button><div id="err" class="err"></div></div></section>
<section id="app" class="app hidden"><aside id="side" class="side"><div class="brand"><button id="mobileClose" class="mobile-back">‹</button><img src="/favicon.jpg"><div class="grow"><b>گوربا بتمن</b><div class="muted">رفیق‌ها و گفتگوها</div></div><button id="settingsBtn" class="ghost">⚙️</button></div><div class="search"><input id="search" placeholder="🔎 پیدا کردن افراد با نام..."></div><div class="section-title">نتایج جستجو</div><div id="results" class="results"></div><div class="section-title">👥 رفیق‌ها و گفتگوها</div><div id="chats" class="chats"></div><div class="profile"><div id="myAvatar" class="avatar"></div><div class="grow"><b id="myName"></b><small class="muted">حساب من</small></div><button id="profileBtn" class="ghost">پروفایل</button><button id="logout" class="ghost">خروج</button></div></aside><main class="main"><div id="empty" class="empty"><button id="mobileOpen" class="mobile-menu">☰ گفتگوها</button><h2>گفتگو را شروع کن 👋</h2><div>هر کسی که وارد گوربا بتمن شود خودکار در فهرست می‌آید.</div></div><div id="chat" class="hidden" style="display:flex;flex-direction:column;height:100%"><header class="top"><button id="mobileOpen2" class="mobile-menu">☰</button><div id="chatAvatar" class="avatar clickable"></div><div class="grow clickable" id="chatHead"><b id="chatName"></b><div id="chatStatus" class="muted"></div></div></header><div id="messages" class="messages"></div><div class="composer"><input id="mediaFile" type="file" accept="image/*,video/*" hidden><button id="attachBtn" class="attach">📎</button><textarea id="text" placeholder="پیامت را بنویس... (Enter برای ارسال)" maxlength="4000"></textarea><button id="send" class="send">➤</button></div></div></main></section>
<div id="profileBox" class="profile-box hidden"><div class="modal"><h3>پروفایل من</h3><input id="profileName" class="input" maxlength="40" placeholder="نام"><textarea id="profileBio" class="input" maxlength="160" placeholder="بیوگرافی کوتاه"></textarea><label class="muted">عکس پروفایل</label><input id="avatarFile" class="file" type="file" accept="image/*"><div class="row"><button id="saveProfile" class="primary">ذخیره</button><button id="closeProfile" class="ghost">بستن</button></div><div id="profileErr" class="err"></div></div></div>
<div id="otherBox" class="profile-box hidden"><div class="modal profile-public"><div id="otherAvatar" class="avatar big"></div><h3 id="otherName"></h3><p id="otherBio" class="bio"></p><div id="otherLast" class="muted"></div><button id="closeOther" class="ghost wide">بستن</button></div></div>
<div id="settingsBox" class="profile-box hidden"><div class="modal"><h3>🎨 تنظیمات ظاهر</h3><div class="setting-title">تم</div><div class="choices"><button class="choice" data-theme="midnight">🌌 نیمه‌شب</button><button class="choice" data-theme="dark">🌑 تاریک</button><button class="choice" data-theme="light">☀️ روشن</button><button class="choice" data-theme="purple">🪻 بنفش</button></div><div class="setting-title">پس‌زمینه گفتگو</div><div class="choices"><button class="choice" data-bg="default">پیش‌فرض</button><button class="choice" data-bg="blue">آبی</button><button class="choice" data-bg="gradient">گرادیان</button><label class="choice gallery-choice">🖼️ انتخاب از گالری<input id="bgFile" type="file" accept="image/*" hidden></label></div><button id="closeSettings" class="ghost wide">بستن</button></div></div>
<script src="/app.js?v=main20260908media1"></script>
</body></html>
