<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1687f8"><meta name="description" content="گوربا بتمن؛ پیام‌رسان ساده و خصوصی"><link rel="icon" href="/favicon.jpg" type="image/jpeg"><link rel="apple-touch-icon" href="/favicon.jpg"><title>گوربا بتمن</title><link rel="stylesheet" href="/style.css"><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><div class="app"><header><div class="brand"><img src="/favicon.jpg" class="brand-icon" alt=""><b>گوربا بتمن</b></div><span id="status">آماده</span></header><section id="login" class="card"><h2>ورود</h2><p>با Google وارد شو یا یک نام نمایشی انتخاب کن.</p><div id="googleButton" class="google-box"></div><div class="divider"><span>یا</span></div><input id="name" maxlength="40" autocomplete="nickname" placeholder="نام نمایشی"><button id="join">ورود به گوربا بتمن</button><p class="muted">برای فعال شدن ورود Google، Client ID پروژه Google را در Cloudflare قرار بده.</p></section><section id="main" class="hidden"><div class="profile-card"><button id="avatarButton" class="avatar-button" type="button" title="انتخاب عکس پروفایل"><span id="avatarText">👤</span><img id="avatar" alt="عکس پروفایل" hidden></button><div class="profile-info"><strong id="myName">کاربر</strong><small>روی عکس بزن تا از گالری انتخاب کنی</small></div><input id="avatarFile" type="file" accept="image/*" hidden></div><div class="search"><input id="search" maxlength="40" placeholder="جستجوی اسم کاربر..."><div id="results"></div></div><div class="chat-title"><button id="back" type="button">←</button><div><strong id="peerName">یک نفر را انتخاب کن</strong><small id="chatHint">برای شروع، از بالا یک کاربر را انتخاب کن.</small></div></div><section id="chat"><div id="messages"></div><form id="form"><input id="text" maxlength="2000" autocomplete="off" placeholder="پیامت را بنویس..." disabled><label class="file-button" title="ارسال عکس یا ویدیو">📎<input id="mediaFile" type="file" accept="image/*,video/*" hidden></label><button id="send" type="submit" disabled>ارسال</button></form></section></section></div><script src="/app.js"></script></body></html>
