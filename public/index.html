<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>گوربا بتمن</title>
<link rel="icon" href="/favicon.jpg"><style>
*{box-sizing:border-box}body{margin:0;background:#171a21;color:#eee;font-family:Tahoma,Arial,sans-serif}
.auth{min-height:100vh;display:grid;place-items:center}.card{width:min(400px,92vw);padding:30px;background:#242832;border-radius:22px;text-align:center}
input,button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:12px;font-size:16px}
input{background:#343946;color:#fff;outline:0}button{background:#6957e8;color:white;cursor:pointer}
.err{min-height:24px;color:#ff7675;margin-top:10px}.hidden{display:none}
.app{min-height:100vh;display:grid;place-items:center}.panel{width:min(1100px,96vw);height:min(760px,94vh);display:grid;grid-template-columns:330px 1fr;background:#20232c;border-radius:20px;overflow:hidden}
.side{padding:20px;border-left:1px solid #ffffff12}.me{margin:20px 0;padding:16px;background:#2c303a;border-radius:15px}.avatar{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#6957e8;margin-left:10px}.chat{display:grid;place-items:center;color:#9ca3af}
@media(max-width:700px){.panel{width:100vw;height:100vh;border-radius:0;grid-template-columns:1fr}.chat{display:none}}
</style></head><body>
<div id="auth" class="auth"><div class="card"><h1>🐱 گوربا بتمن</h1><p>نام نمایشی‌ات را وارد کن</p>
<input id="name" maxlength="40" placeholder="مثلاً پوریا" autocomplete="name">
<button id="login">ورود</button><div id="err" class="err"></div></div></div>
<div id="app" class="app hidden"><div class="panel"><aside class="side"><h2>گفتگوها</h2>
<div class="me"><span id="avatar" class="avatar"></span><span id="hello"></span></div>
<button id="logout">خروج</button></aside><main class="chat">ورود موفق شد؛ گفتگو را انتخاب کنید</main></div></div>
<script src="/app.js?v=20260908"></script></body></html>
